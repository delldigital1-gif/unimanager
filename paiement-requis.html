<!DOCTYPE html>
<html lang="fr">
<head>
<style>html{visibility:hidden}</style>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UniManage — Choisissez votre plan</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--navy:#0D1B2A;--blue:#1A56DB;--sky:#3B82F6;--gold:#F59E0B;--light:#F0F4FF;--gray:#64748B;--border:#E2E8F0;--success:#10B981;--danger:#EF4444;--purple:#8B5CF6;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:#F8FAFC;color:var(--navy);min-height:100vh;}
    .topbar{padding:1.25rem 5%;border-bottom:1px solid var(--border);background:white;display:flex;align-items:center;justify-content:space-between;}
    .logo{font-family:'Playfair Display',serif;font-weight:800;font-size:1.3rem;color:var(--navy);}
    .logo span{color:var(--blue);}
    .wrap{max-width:960px;margin:0 auto;padding:3rem 1.5rem;}
    .head{text-align:center;margin-bottom:2.5rem;}
    .head h1{font-family:'Playfair Display',serif;font-weight:800;font-size:1.8rem;margin-bottom:.6rem;}
    .head p{color:var(--gray);font-size:.95rem;}
    .alert-trial{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:#92400E;border-radius:12px;padding:1rem 1.25rem;font-size:.9rem;margin-bottom:2rem;text-align:center;}
    .plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem;}
    @media(max-width:800px){.plan-grid{grid-template-columns:1fr}}
    .price-card{background:white;border:1.5px solid var(--border);border-radius:16px;padding:1.75rem;display:flex;flex-direction:column;}
    .price-card.featured{border-color:var(--blue);box-shadow:0 10px 30px rgba(26,86,219,0.12);}
    .plan-name{font-family:'Playfair Display',serif;font-weight:800;font-size:1.15rem;margin-bottom:.25rem;}
    .plan-price{font-family:'Playfair Display',serif;font-weight:800;font-size:1.6rem;margin:.75rem 0;}
    .plan-price span{font-size:.8rem;font-weight:400;color:var(--gray);}
    .btn-plan{display:block;text-align:center;width:100%;padding:.85rem;border-radius:10px;border:none;font-weight:700;font-size:.9rem;cursor:pointer;margin-top:1.25rem;text-decoration:none;}
    .btn-plan-fill{background:var(--blue);color:white;}
    .btn-plan-fill:hover{background:#1344b8;}
    .btn-plan-outline{background:white;color:var(--navy);border:1.5px solid var(--border);}
    .btn-plan-outline:hover{border-color:var(--blue);color:var(--blue);}
    .btn-plan:disabled{opacity:.5;cursor:not-allowed;}
    .status-msg{text-align:center;margin-top:1.5rem;font-size:.85rem;color:var(--gray);min-height:1.2rem;}
    .status-msg.error{color:var(--danger);}
    .plan-features{list-style:none;margin:1rem 0;flex:1;}
    .plan-features li{font-size:.8rem;color:var(--gray);padding:.3rem 0;padding-left:1.3rem;position:relative;}
    .plan-features li::before{content:"✓";position:absolute;left:0;color:var(--success);font-weight:700;}
    .plan-note{text-align:center;color:var(--gray);font-size:.78rem;margin-top:1.5rem;}
    .periode-card{max-width:460px;margin:0 auto;background:white;border:1.5px solid var(--border);border-radius:16px;padding:2rem;}
    .periode-head{text-align:center;margin-bottom:1.5rem;}
    .periode-head h2{font-family:'Playfair Display',serif;font-weight:800;font-size:1.4rem;}
    .periode-head p{color:var(--gray);font-size:.85rem;margin-top:.15rem;}
    .link-btn{background:none;border:none;color:var(--gray);font-size:.78rem;text-decoration:underline;cursor:pointer;margin-top:.4rem;}
    .link-btn:hover{color:var(--blue);}
    .cycle-pills{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-bottom:1.5rem;}
    .cycle-pill{padding:.55rem 1.1rem;border-radius:8px;border:1.5px solid var(--border);background:white;color:var(--gray);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .15s;}
    .cycle-pill:hover{color:var(--navy);}
    .cycle-pill.active{border-color:var(--blue);background:var(--blue);color:white;}
    .periode-price{text-align:center;font-family:'Playfair Display',serif;font-weight:800;font-size:1.7rem;margin-bottom:.25rem;}
    .periode-unit{font-size:.85rem;font-weight:400;color:var(--gray);}
  </style>
</head>
<body>
<div class="topbar">
  <div class="logo">Uni<span>Manage</span></div>
  <a href="#" onclick="logout();return false;" style="color:var(--gray);font-size:.85rem;text-decoration:none;">Se déconnecter</a>
</div>

<div class="wrap">
  <div class="head">
    <h1>Activez votre abonnement</h1>
    <p>Choisissez un plan pour accéder à votre espace UniManage.</p>
  </div>
  <div id="trialAlert" class="alert-trial" style="display:none"></div>

  <!-- ═══ Étape 1 : choix du plan ═══ -->
  <div id="panelPlans">
    <div class="plan-grid" id="planGrid"></div>
    <p class="plan-note">Prix affiché à titre indicatif (équivalent mensuel) — la facturation se fait par cycle trimestriel, semestriel ou annuel, à choisir à l'étape suivante.</p>
  </div>

  <!-- ═══ Étape 2 : choix de la périodicité ═══ -->
  <div id="panelPeriode" style="display:none">
    <div class="periode-card">
      <div class="periode-head">
        <h2 id="periodePlanName">—</h2>
        <p id="periodePlanSub"></p>
        <button type="button" class="link-btn" onclick="retourPlans()">← Changer de plan</button>
      </div>
      <div class="cycle-pills" id="cyclePills">
        <button type="button" class="cycle-pill" data-cycle="trimestriel" onclick="choisirCycle('trimestriel')">Trimestriel</button>
        <button type="button" class="cycle-pill" data-cycle="semestriel" onclick="choisirCycle('semestriel')">Semestriel</button>
        <button type="button" class="cycle-pill" data-cycle="annuel" onclick="choisirCycle('annuel')">Annuel</button>
      </div>
      <div class="periode-price"><span id="periodeAmount">—</span> <span class="periode-unit" id="periodeUnit"></span></div>
      <ul class="plan-features" id="periodeFeatures"></ul>
      <button type="button" class="btn-plan btn-plan-fill" id="btnPayer" onclick="payer()">Payer maintenant</button>
      <div id="statusMsg" class="status-msg"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth-guard.js"></script>
<script>
  // Page volontairement en dehors du gate de requireAuth() (elle EST la
  // destination du gate) : vérifie juste la session, sans re-déclencher le
  // contrôle d'essai qui provoquerait une boucle de redirection.
  let currentSession = null;

  // Flux plan → périodicité repris de SynergySphere (pastilles cliquables +
  // prix live), mais en 2 panneaux dans une seule page statique au lieu de
  // 2 routes Next.js. Plus de mensuel ni de calcul par %, décision
  // utilisateur 2026-08-13 — chaque combinaison plan×cycle a un prix fixe,
  // identique à la table PRICES_FCFA de l'Edge Function.
  const PLANS = {
    starter: {
      name: 'Starter', sub: "Jusqu'à 300 étudiants",
      prices: { trimestriel: 375000, semestriel: 750000, annuel: 1500000 },
      features: ['Administration scolaire', 'Gestion étudiants & enseignants', 'Emploi du temps basique', 'Examens & résultats', '5 comptes administrateurs', 'Support email'],
    },
    pro: {
      name: 'Pro', sub: "Jusqu'à 1 500 étudiants", featured: true,
      prices: { trimestriel: 405000, semestriel: 810000, annuel: 1620000 },
      features: ['Tout le plan Starter', 'Gestion comptable complète', 'Wave & Orange Money', 'Rapports & Analytics (exports CSV)', 'Notifications email en masse', 'Emploi du temps intelligent', 'Sous-domaine personnalisé', '20 comptes administrateurs', 'Support prioritaire'],
    },
    max: {
      name: 'Max', sub: 'Étudiants illimités',
      prices: { trimestriel: 450000, semestriel: 900000, annuel: 1800000 },
      features: ['Tout le plan Pro', 'Diplômes & Certificats officiels', 'Intégrations sur mesure', 'Administrateurs illimités', 'Account manager dédié', 'SLA 99.9% garanti'],
    },
  };
  const CYCLE_LABELS = { trimestriel: 'Trimestriel', semestriel: 'Semestriel', annuel: 'Annuel' };
  const CYCLE_MONTHS = { trimestriel: 3, semestriel: 6, annuel: 12 };

  let selectedPlan = null;
  let selectedCycle = 'trimestriel';

  function renderPlanGrid() {
    const grid = document.getElementById('planGrid');
    grid.innerHTML = Object.entries(PLANS).map(([key, plan]) => {
      const monthlyEquiv = Math.round(plan.prices.trimestriel / CYCLE_MONTHS.trimestriel);
      return `
        <div class="price-card${plan.featured ? ' featured' : ''}">
          <div class="plan-name">${plan.name}</div>
          <div style="font-size:.8rem;color:var(--gray)">${plan.sub}</div>
          <div class="plan-price">${monthlyEquiv.toLocaleString('fr-FR')} <span>FCFA / mois*</span></div>
          <ul class="plan-features">${plan.features.map(f => `<li>${f}</li>`).join('')}</ul>
          <button type="button" class="btn-plan ${plan.featured ? 'btn-plan-fill' : 'btn-plan-outline'}" onclick="choisirPlan('${key}')">Choisir ${plan.name}</button>
        </div>`;
    }).join('');
  }

  function choisirPlan(planKey) {
    selectedPlan = planKey;
    selectedCycle = 'trimestriel';
    renderPeriode();
    document.getElementById('panelPlans').style.display = 'none';
    document.getElementById('panelPeriode').style.display = 'block';
    history.replaceState(null, '', '?plan=' + planKey);
  }

  function retourPlans() {
    document.getElementById('panelPeriode').style.display = 'none';
    document.getElementById('panelPlans').style.display = 'block';
    history.replaceState(null, '', location.pathname);
  }

  function choisirCycle(cycle) {
    selectedCycle = cycle;
    renderPeriode();
  }

  function renderPeriode() {
    const plan = PLANS[selectedPlan];
    document.getElementById('periodePlanName').textContent = plan.name;
    document.getElementById('periodePlanSub').textContent = plan.sub;
    document.querySelectorAll('.cycle-pill').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.cycle === selectedCycle);
    });
    const amount = plan.prices[selectedCycle];
    document.getElementById('periodeAmount').textContent = amount.toLocaleString('fr-FR') + ' FCFA';
    document.getElementById('periodeUnit').textContent = '/ ' + CYCLE_LABELS[selectedCycle].toLowerCase();
    document.getElementById('periodeFeatures').innerHTML = plan.features.map(f => `<li>${f}</li>`).join('');
    document.getElementById('statusMsg').textContent = '';
    document.getElementById('statusMsg').className = 'status-msg';
    document.getElementById('btnPayer').disabled = false;
  }

  async function init() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }
    currentSession = session;

    const planFromUrl = new URLSearchParams(location.search).get('plan');
    const changerVolontaire = new URLSearchParams(location.search).has('changer');
    const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
    if (profile && profile.university) {
      const { data: uni } = await supabaseClient.from('universities').select('status, trial_ends_at').eq('name', profile.university).maybeSingle();
      if (uni && uni.status === 'Actif' && !planFromUrl && !changerVolontaire) {
        // Abonnement déjà actif (payé entretemps, ou faux positif) et aucune
        // intention explicite de venir ici (?plan= depuis une page gatée, ou
        // ?changer=1 depuis "Changer de plan" en Facturation) — retour au
        // tableau de bord. Sinon, laisser passer : c'est un flux volontaire.
        window.location.href = 'dashboard.html';
        return;
      }
      if (uni && uni.trial_ends_at) {
        const alertEl = document.getElementById('trialAlert');
        alertEl.style.display = 'block';
        alertEl.textContent = `⏳ Votre essai de 14 jours s'est terminé le ${new Date(uni.trial_ends_at).toLocaleDateString('fr-FR')}.`;
      }
    }

    renderPlanGrid();
    if (planFromUrl && PLANS[planFromUrl]) {
      choisirPlan(planFromUrl);
    }
    document.documentElement.style.visibility = 'visible';
  }

  async function payer() {
    const statusEl = document.getElementById('statusMsg');
    const btn = document.getElementById('btnPayer');
    statusEl.className = 'status-msg';
    statusEl.textContent = '⏳ Préparation du paiement…';
    btn.disabled = true;

    try {
      const resp = await fetch(`${SUPABASE_URL}/functions/v1/initier-paiement-abonnement`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${currentSession.access_token}`,
        },
        body: JSON.stringify({ plan: selectedPlan, cycle: selectedCycle }),
      });
      const data = await resp.json();
      if (!resp.ok || data.erreur) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = '⚠️ ' + (data.erreur || data.error || 'Erreur inconnue');
        btn.disabled = false;
        return;
      }
      if (data.mode === 'sandbox') {
        statusEl.textContent = `🧪 Mode sandbox (CinetPay pas encore activé) — transaction ${data.transaction_id} créée.`;
      }
      window.location.href = data.url_paiement + (data.url_paiement.includes('?') ? '&' : '?') + 'transaction_id=' + data.transaction_id;
    } catch (e) {
      statusEl.className = 'status-msg error';
      statusEl.textContent = '⚠️ Impossible de contacter le service de paiement.';
      btn.disabled = false;
    }
  }

  init();
</script>
</body>
</html>
